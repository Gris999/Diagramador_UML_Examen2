@if (visible()) {
  <div class="flex min-w-0 max-w-[16rem] items-center gap-2" data-testid="room-title">
    @if (editing()) {
      <input
        type="text"
        class="field !w-48 py-1 text-sm"
        aria-label="Nombre del diagrama"
        maxlength="80"
        #titleInput
        data-testid="room-title-input"
        [value]="draft()"
        [disabled]="saving()"
        (input)="onInput($event)"
        (keydown.enter)="save()"
        (keydown.escape)="cancel()"
        (blur)="save()"
      />
    } @else {
      <button
        type="button"
        class="min-w-0 truncate rounded px-1.5 py-1 text-sm font-medium text-fg hover:bg-hover disabled:cursor-default disabled:hover:bg-transparent"
        [disabled]="!isOwner()"
        [title]="isOwner() ? 'Cambiar el nombre del diagrama' : (title() || 'Sin título')"
        data-testid="room-title-text"
        (click)="startEdit()"
      >
        {{ title() || 'Sin título' }}
      </button>
    }
    <span class="badge shrink-0" [class.badge-brand]="isOwner()" data-testid="room-role">{{ roleText() }}</span>
    @if (error()) {
      <span class="text-xs text-danger" role="alert" data-testid="room-title-error">{{ error() }}</span>
    }
  </div>
}
