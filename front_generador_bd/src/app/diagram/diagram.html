<div class="app-layout">
  <app-side-panel #sidePanel></app-side-panel>

  <div class="canvas-wrapper" cdkDropListGroup>
    <div class="flex flex-wrap items-center gap-3 border-b border-slate-200 bg-white px-3 py-2 shadow-sm">

      <!-- Zoom -->
      <div class="inline-flex overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm" role="group" aria-label="Zoom">
        <button
          (click)="zoomOut()"
          class="icon-btn"
          title="Alejar"
          aria-label="Alejar"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-4 w-4" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>

        <button
          (click)="resetZoom()"
          class="icon-btn"
          title="Restablecer zoom"
          aria-label="Restablecer zoom"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16" /><path d="M3 21v-5h5" /></svg>
        </button>

        <button
          (click)="zoomIn()"
          class="icon-btn"
          title="Acercar"
          aria-label="Acercar"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-4 w-4" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </div>

      <div class="h-6 w-px bg-slate-200" aria-hidden="true"></div>

      <!-- XMI -->
      <button
        (click)="xmiInput.click()"
        class="btn btn-secondary btn-sm"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 text-purple-600" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4" /><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" /></svg>
        Importar XMI
      </button>

      <button
        (click)="exportXmi()"
        class="btn btn-secondary btn-sm"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 text-purple-600" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4" /><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" /></svg>
        Exportar XMI
      </button>

      <app-help-panel></app-help-panel>

      <input
        #xmiInput
        type="file"
        accept=".xmi,.xml,application/xml,text/xml"
        class="hidden"
        (change)="importXmi($event)"
      />

      <div class="ml-auto flex max-w-full flex-wrap items-start justify-end gap-3">
        <app-activity-panel></app-activity-panel>
        <app-participants-panel></app-participants-panel>
      </div>
    </div>

    <div
      #paperContainer
      class="diagram-container"
      cdkDropList
    >
      <!-- Canvas JointJS -->
    </div>
  </div>

  <app-ia-chat-panel></app-ia-chat-panel>
</div>
