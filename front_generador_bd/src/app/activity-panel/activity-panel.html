<section
  class="w-72 max-w-full shrink-0 rounded border border-gray-300 bg-white px-2 py-1.5 shadow-sm"
  aria-label="Actividad de la sala"
  data-testid="activity-panel"
>
  <h3 class="mb-1 text-xs font-semibold text-gray-800">Actividad</h3>

  @if (events().length === 0) {
    <p class="text-xs text-gray-500">Todavía no hay actividad.</p>
  } @else {
    <ul class="max-h-48 space-y-1 overflow-y-auto pr-1" data-testid="activity-list">
      @for (event of events(); track event.id) {
        <li class="border-b border-gray-100 pb-1 text-xs last:border-b-0" data-testid="activity-entry">
          <div class="flex items-baseline justify-between gap-2">
            <strong class="min-w-0 truncate text-gray-800">
              {{ event.actor_name || 'Usuario' }}
            </strong>
            <time class="shrink-0 text-[10px] text-gray-400" [attr.datetime]="event.created_at">
              {{ relativeTime(event.created_at) }}
            </time>
          </div>
          <p class="text-gray-600">{{ event.summary }}</p>
        </li>
      }
    </ul>
  }
</section>
