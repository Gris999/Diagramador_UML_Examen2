services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17
    container_name: postgres_db
    restart: always
    env_file:
      - ./back_generador_bd/.env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # MongoDB guarda la conversación con la IA y el registro de actividad si ACTIVITY_STORE / CONVERSATION_STORE valen "mongo" (ver
  # back_generador_bd/.env.example). La memoria de WiredTiger se acota para que quepa junto a los demás contenedores en una máquina de 2 GB.
  mongo:
    image: mongo:7
    container_name: mongo_db
    restart: always
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    env_file:
      - ./back_generador_bd/.env
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest 
    container_name: pgadmin
    restart: always
    env_file:
      - ./back_generador_bd/.env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      #- ./aula-inteligente-back/rp.sql:/tmp/rp.sql
    ports:
      - "5050:80"
    user: "5050:5050"
    # entrypoint: >
    #   /bin/sh -c "
    #     chown -R 5050:5050 /var/lib/pgadmin && 
    #     chmod -R 775 /var/lib/pgadmin && 
    #     mkdir -p /var/lib/pgadmin/storage/admin_example.com && 
    #     cp /tmp/rp.sql /var/lib/pgadmin/storage/admin_example.com/rp.sql && 
    #     /entrypoint.sh"
    depends_on:
      - postgres
    networks:
      - backend

networks:
  backend:
    external: true

volumes:
  pgdata:
  mongodata:
  pgadmin_data:
