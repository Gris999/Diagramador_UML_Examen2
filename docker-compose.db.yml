services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17
    container_name: postgres_db
    restart: always
    env_file:
      - ./back_generador_bd/.env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest 
    container_name: pgadmin
    restart: always
    env_file:
      - ./back_generador_bd/.env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      #- ./aula-inteligente-back/rp.sql:/tmp/rp.sql
    ports:
      - "5050:80"
    user: "5050:5050"
    # entrypoint: >
    #   /bin/sh -c "
    #     chown -R 5050:5050 /var/lib/pgadmin && 
    #     chmod -R 775 /var/lib/pgadmin && 
    #     mkdir -p /var/lib/pgadmin/storage/admin_example.com && 
    #     cp /tmp/rp.sql /var/lib/pgadmin/storage/admin_example.com/rp.sql && 
    #     /entrypoint.sh"
    depends_on:
      - postgres
    networks:
      - backend

networks:
  backend:
    external: true

volumes:
  pgdata:
  pgadmin_data:
