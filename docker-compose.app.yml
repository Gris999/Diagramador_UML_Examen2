services:
  django:
    build: ./back_generador_bd/
    container_name: django_backend_UML
    command: >
      sh -c "python manage.py makemigrations &&
            python manage.py migrate &&
            python manage.py clear_room_state &&
            daphne -b 0.0.0.0 -p 8000 diagramador_uml.asgi:application"

    volumes:
      - ./back_generador_bd:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - ./back_generador_bd/.env
    networks:
      - backend  
      - frontend

  redis:
    image: public.ecr.aws/docker/library/redis:7
    container_name: redis_server
    ports:
      - "6379:6379"
    networks:
      - backend

  spring-backend:
    build: ./back_generator_uml/
    container_name: spring_backend
    environment:
      - SERVER_PORT=7001
      # Origenes CORS extra, separados por coma (se suman a los del codigo). Se toma del .env junto a este archivo.
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-}
    ports:
      - "7001:7001"

    depends_on:
      - angular-app
    networks:
      - backend
      - frontend

  angular-app:
    build: ./front_generador_bd/
    container_name: angular_frontend
    ports:
      - "4200:4000"
    networks:
      - frontend
      - backend

networks:
  backend:
    external: true
  frontend:
    driver: bridge